# Publica la landing en Vercel. Se lanza a mano: Actions → Deploy → Run workflow.
# La rama a publicar es la de "Use workflow from". Producción solo acepta main; staging
# acepta cualquier rama que tenga este workflow (las ramas viejas: rebase sobre main).
# Ver DOCS.md, sección 11.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      destino:
        description: "Dónde publicar"
        type: choice
        options:
          - staging
          - produccion
        default: staging
      password:
        description: "Contraseña de staging (obligatoria en staging; en producción se ignora)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.destino }}
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@63.1.2
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: ${{ inputs.destino }} ← ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      DESTINO: ${{ inputs.destino }}
      RAMA: ${{ github.ref_name }}
    steps:
      # El repo es público y los inputs no son secretos: la contraseña se lee del evento
      # (no de una variable, que se imprimiría en el log) y se enmascara antes de cualquier
      # otro paso. Desde acá aparece como *** en los logs.
      - name: Validar pedido
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$DESTINO" = "staging" ]; then
            password=$(jq -r '.inputs.password // ""' "$GITHUB_EVENT_PATH")
            if [ -z "$password" ]; then
              echo "::error::Para publicar en staging hay que escribir la contraseña en el campo 'password'."
              exit 1
            fi
            echo "::add-mask::$password"
            delim="EOF_$(openssl rand -hex 16)"
            { echo "STAGING_PASSWORD<<$delim"; echo "$password"; echo "$delim"; } >> "$GITHUB_ENV"
          fi
          if [ "$DESTINO" = "produccion" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Producción solo publica main (elegiste $RAMA en 'Use workflow from'). Para probar otra rama, usá destino staging."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Staging - agregar contraseña e imágenes sin optimizar
        if: inputs.destino == 'staging'
        run: |
          if ls middleware.* src/middleware.* >/dev/null 2>&1; then
            echo "::error::La rama ya tiene un middleware propio: combinarlo con deploy/staging-middleware.ts antes de publicar en staging."
            exit 1
          fi
          cp deploy/staging-middleware.ts middleware.ts
          if [ -f next.config.mjs ]; then
            mv next.config.mjs next.config.base.mjs
          elif ls next.config.* >/dev/null 2>&1; then
            echo "::error::La rama usa un next.config que no es .mjs: adaptar deploy/staging-next-config.mjs."
            exit 1
          else
            echo "export default {};" > next.config.base.mjs
          fi
          cp deploy/staging-next-config.mjs next.config.mjs

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Lint, tests y build
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Verificar el build local
        run: |
          npx next start -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          bash deploy/verify.sh http://localhost:3000 "$DESTINO"

      - name: Subir a Vercel (sin tocar el dominio todavía)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ inputs.destino == 'produccion' && vars.VERCEL_PROJECT_ID_PRODUCCION || vars.VERCEL_PROJECT_ID_STAGING }}
        run: |
          # Se sube una copia sin .git: en Hobby, Vercel bloquea deploys cuyo último commit
          # es de alguien que no pertenece a la cuenta.
          mkdir "$RUNNER_TEMP/upload"
          rsync -a --exclude .git --exclude node_modules --exclude .next ./ "$RUNNER_TEMP/upload/"
          cd "$RUNNER_TEMP/upload"
          args=(deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          if [ "$DESTINO" = "staging" ]; then
            args+=(--build-env "STAGING_PASSWORD=$STAGING_PASSWORD" --env "STAGING_PASSWORD=$STAGING_PASSWORD")
          fi
          npx --yes "$VERCEL_CLI" "${args[@]}" > "$RUNNER_TEMP/deploy.out"
          # La CLI imprime la URL, o un JSON si cree que la corre un agente.
          if jq -e . "$RUNNER_TEMP/deploy.out" >/dev/null 2>&1; then
            url=$(jq -r '.deployment.url // .url' "$RUNNER_TEMP/deploy.out")
          else
            url=$(tail -n 1 "$RUNNER_TEMP/deploy.out")
          fi
          case "$url" in https://*) ;; *) url="https://$url" ;; esac
          echo "Deploy nuevo: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verificar el deploy nuevo (antes de pasarlo al dominio)
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: bash deploy/verify.sh "$URL" "$DESTINO"

      - name: Pasar el deploy al dominio
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ inputs.destino == 'produccion' && vars.VERCEL_PROJECT_ID_PRODUCCION || vars.VERCEL_PROJECT_ID_STAGING }}
        run: npx --yes "$VERCEL_CLI" promote "$URL" --yes --token "$VERCEL_TOKEN"

      - name: Verificar el dominio
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ "$DESTINO" = "produccion" ]; then domain=https://mostrateonline.com.ar; else domain=https://staging.mostrateonline.com.ar; fi
          bash deploy/verify.sh "$domain" "$DESTINO"
          {
            echo "### Publicado en $DESTINO"
            echo "- Dominio: $domain"
            echo "- Deploy: $URL"
            echo "- Rama: \`$RAMA\` ($(git rev-parse --short HEAD))"
          } >> "$GITHUB_STEP_SUMMARY"
